name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  node-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # IMPORTANT: no npm cache because we don't have package-lock.json yet

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> $GITHUB_OUTPUT
          else
            echo "has_node=false" >> $GITHUB_OUTPUT
          fi

      - name: Install
        if: steps.detect.outputs.has_node == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck (if present)
        if: steps.detect.outputs.has_node == 'true'
        run: |
          npm run -s typecheck || true

      - name: Tests (if present)
        if: steps.detect.outputs.has_node == 'true'
        run: |
          npm test || true

      - name: Build (if present)
        if: steps.detect.outputs.has_node == 'true'
        run: |
          npm run -s build || true

      - name: No-op (no package.json yet)
        if: steps.detect.outputs.has_node == 'false'
        run: echo "No package.json yet — CI is in safe-mode."

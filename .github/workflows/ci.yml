name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  node-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files (diagnostic)
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- server/analytics ----"
          ls -la server/analytics || true
          echo "---- package.json ----"
          sed -n '1,200p' package.json || true
          echo "---- tsconfig.json ----"
          cat tsconfig.json || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show Node/NPM versions
        run: |
          node -v
          npm -v

      - name: Install (diagnostic)
        run: |
          set -x
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck (diagnostic)
        run: |
          set -x
          npm run -s typecheck

      - name: Tests (diagnostic)
        run: |
          set -x
          npm test

      - name: Build (diagnostic)
        run: |
          set -x
          npm run -s build

name: reports

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "data/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/reports.yml"

jobs:
  batch-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run -s typecheck

      - name: Batch evaluate (writes reports/)
        run: npm run -s eval:batch -- data

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: oleaforecast-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

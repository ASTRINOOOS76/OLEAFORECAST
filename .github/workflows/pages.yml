name: pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "data/**"
      - "site/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run -s typecheck

      - name: Generate reports (winners.json)
        run: npm run -s eval:batch -- data

      - name: Validate winners.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('reports/winners.json','utf8')); console.log('winners.json OK')"

      - name: Prepare site bundle + history
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r site/* dist/
          cp reports/winners.json dist/winners.json

          # history snapshot key
          TS=$(node -e "const j=require('./reports/winners.json'); process.stdout.write((j.generatedAt||new Date().toISOString()).replace(/[:.]/g,'-'))")
          mkdir -p dist/history/$TS
          cp reports/winners.json dist/history/$TS/winners.json

          # create/refresh index.json
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');

          function listDirs(p){
            if(!fs.existsSync(p)) return [];
            return fs.readdirSync(p,{withFileTypes:true}).filter(d=>d.isDirectory()).map(d=>d.name).sort().reverse();
          }

          const histDir='dist/history';
          const runs=listDirs(histDir).slice(0, 20); // keep latest 20
          const index={ updatedAt: new Date().toISOString(), runs };
          fs.writeFileSync(path.join(histDir,'index.json'), JSON.stringify(index,null,2)+'\n','utf8');
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
